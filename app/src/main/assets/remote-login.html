<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TV Filer"><meta name="theme-color" content="#0b0f17">
<title>TV Filer</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 20% -10%,#1d2b55 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#3a1f5c 0,transparent 55%),#0b0f17;color:#e8ecf4;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
.card{width:100%;max-width:360px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:28px 24px;backdrop-filter:blur(10px)}
h1{margin:0 0 4px;font-size:22px;font-weight:650;letter-spacing:-.01em}
p{margin:0 0 20px;color:#9aa6bd;font-size:14px}
input{width:100%;font-size:28px;letter-spacing:.4em;text-align:center;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);color:#fff;outline:none}
input:focus{border-color:#6f8cff;box-shadow:0 0 0 3px rgba(111,140,255,.25)}
button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:14px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,#5b7cff,#8a5bff);cursor:pointer}
.bad{color:#ff8a8a;font-size:14px;margin:-8px 0 14px}
</style></head><body>
<form class="card" method="post" action="/login">
<h1>TV Filer</h1><p>Enter the PIN. Send "web remote" on the TV remote if you need it again.</p>
<div class="bad" id="bad" hidden>That PIN didn't work.</div>
<input name="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required autofocus>
<button type="submit">Open</button>
</form>
<script>if(/bad=1/.test(location.search))document.getElementById('bad').hidden=false;</script>
</body></html>
