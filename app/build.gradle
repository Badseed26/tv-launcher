plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")

android {
    namespace 'com.ethan.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.ethan.tvlauncher"
        minSdk 23
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    signingConfigs {
        launcher {
            // Key comes from GitHub secrets at build time (see the workflow). Never commit it.
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            if (ksPath) storeFile file(ksPath)
            storePassword ksPass
            keyAlias 'launcher'
            keyPassword ksPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.launcher
        }
        debug {
            signingConfig signingConfigs.launcher
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
