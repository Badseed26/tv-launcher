name: Build APK

on:
  push:
    branches: [main]
    # job code and notes load fresh on the TV, they don't need a new build (21/11)
    paths-ignore:
      - 'jobs/**'
      - 'CLAUDE.md'
      - 'relay/**'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use secret signing key if set
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Copy APK and write version file
        run: |
          cp app/build/outputs/apk/release/app-release.apk tv-launcher.apk
          echo '{"versionCode": ${{ github.run_number }}, "apk": "https://github.com/${{ github.repository }}/releases/download/latest/tv-launcher.apk"}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher
          path: |
            tv-launcher.apk
            version.json

      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tv-launcher.apk version.json --title "Build ${{ github.run_number }}" --notes "Latest TV launcher build"
          # gh sometimes leaves it as a draft after a delete and recreate, which the TV can't see (build 57, 21/11)
          sleep 3
          gh release edit latest --draft=false || true
