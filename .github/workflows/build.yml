name: Build APK

on:
  push:
    branches: [main]
    # job code and notes load fresh on the TV, they don't need a new build (21/11)
    paths-ignore:
      - 'jobs/**'
      - 'CLAUDE.md'
      - 'relay/**'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use secret signing key if set
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Copy APK and write version file
        run: |
          cp app/build/outputs/apk/release/app-release.apk tv-launcher.apk
          echo '{"versionCode": ${{ github.run_number }}, "apk": "https://github.com/${{ github.repository }}/releases/download/latest/tv-launcher.apk"}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher
          path: |
            tv-launcher.apk
            version.json

      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest tv-launcher.apk version.json --title "Build ${{ github.run_number }}" --notes "Latest TV launcher build" --draft=false
          # gh sometimes leaves it as a draft after a delete and recreate, which the TV can't see (builds 57 and 89).
          # A draft can't be found by its tag, so publish it by id, and check it took.
          for i in 1 2 3 4 5; do
            sleep 3
            id=$(gh api "repos/${{ github.repository }}/releases?per_page=10" --jq '[.[] | select(.name == "Build ${{ github.run_number }}")][0].id')
            draft=$(gh api "repos/${{ github.repository }}/releases/$id" --jq '.draft')
            echo "release $id draft=$draft"
            if [ "$draft" = "false" ]; then break; fi
            gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -F draft=false -f tag_name=latest > /dev/null || true
          done
          gh api "repos/${{ github.repository }}/releases/tags/latest" --jq '.name'
